[project]
name = "vigil-face-authentication"
version = "1.0.0"
description = "Modern local biometric face authentication system built with Python, PyQt6, OpenCV, YuNet, SFace, and SQLite."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2,<3.0",
    "opencv-contrib-python>=4.10,<5.0",
    "pydantic>=2.10,<3.0",
    "PyQt6>=6.8,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]